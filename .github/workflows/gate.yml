name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gate (manifest, sintaxe, 100% local, i18n, pricing/models/tokenizer)
        run: node scripts/gate.mjs
      - name: Testes de comportamento (node:test — pricing, models, tokenização)
        run: node --test tests/*.test.mjs
